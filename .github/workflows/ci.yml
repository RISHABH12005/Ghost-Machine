name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke-test production server and security headers
        env:
          PORT: 3000
        shell: bash
        run: |
          set -euo pipefail

          PORT=3000 node ./node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/repopilot-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Next.js server exited before becoming ready:"
              cat /tmp/repopilot-next.log
              exit 1
            fi

            if curl --silent --fail --max-time 5 http://127.0.0.1:3000/ -o /tmp/repopilot-home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Next.js server did not become ready within 30 seconds:"
            cat /tmp/repopilot-next.log
            exit 1
          fi

          test -s /tmp/repopilot-home.html

          headers="$(curl --silent --show-error --head --max-time 5 http://127.0.0.1:3000/)"
          printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY'
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          printf '%s\n' "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'

          invalid_status="$(curl --silent --show-error --output /tmp/repopilot-invalid.json --write-out '%{http_code}' --max-time 10 'http://127.0.0.1:3000/api/repositories/assessment?owner=bad%2Fowner&repo=next.js')"
          test "$invalid_status" = "400"
          node -e "const r=require('/tmp/repopilot-invalid.json'); if (!r.error) process.exit(1)"

          session_status="$(curl --silent --show-error --output /tmp/repopilot-session.json --write-out '%{http_code}' --max-time 10 'http://127.0.0.1:3000/api/auth/session')"
          test "$session_status" = "200"
          node -e "const r=require('/tmp/repopilot-session.json'); if (r.authenticated !== false) process.exit(1)"

          protected_status="$(curl --silent --show-error --output /tmp/repopilot-protected.json --write-out '%{http_code}' --max-time 10 'http://127.0.0.1:3000/api/repositories')"
          test "$protected_status" = "401"
          node -e "const r=require('/tmp/repopilot-protected.json'); if (!r.error) process.exit(1)"
